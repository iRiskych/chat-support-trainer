<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Trainer — ТехноДім</title>
<style>
:root{
  --bg:#f2f5fa; --panel:#ffffff; --text:#1d2530; --muted:#68758c; --accent:#2e6be6; --accent-soft:#e8effd;
  --border:#dde4ee; --ok:#1e9e56; --warn:#b97e0c; --bad:#d54545;
  --bubble-c:#ffffff; --bubble-o:#2e6be6; --bubble-o-text:#ffffff;
  --shadow:0 2px 10px rgba(30,40,60,.07);
}
body[data-theme="dark"]{--bg:#12161f;--panel:#1b2230;--text:#e7ecf4;--muted:#94a0b4;--accent:#5b8cff;--accent-soft:#24304a;--border:#2a3448;--ok:#45d07c;--warn:#e5b04c;--bad:#ef7070;--bubble-c:#222b3d;--bubble-o:#3b5bdb;--bubble-o-text:#fff;--shadow:0 2px 12px rgba(0,0,0,.35)}
body[data-theme="sea"]{--bg:#e9f5f7;--panel:#fff;--text:#14333a;--muted:#557a82;--accent:#0d8a9f;--accent-soft:#dff1f4;--border:#cfe6ea;--ok:#128a5e;--warn:#b97e0c;--bad:#d54545;--bubble-c:#fff;--bubble-o:#0d8a9f;--bubble-o-text:#fff}
body[data-theme="cream"]{--bg:#f7f1e6;--panel:#fffdf8;--text:#3a2f1e;--muted:#8a7a5f;--accent:#b4762a;--accent-soft:#f5e9d6;--border:#e8dcc6;--ok:#5e8c31;--warn:#b97e0c;--bad:#c04f3c;--bubble-c:#fffdf8;--bubble-o:#b4762a;--bubble-o-text:#fff}
body[data-theme="forest"]{--bg:#eef5ec;--panel:#fff;--text:#1c2e20;--muted:#5d7a64;--accent:#2e7d43;--accent-soft:#e2f1e5;--border:#d3e5d6;--ok:#2e7d43;--warn:#b97e0c;--bad:#c04f3c;--bubble-c:#fff;--bubble-o:#2e7d43;--bubble-o-text:#fff}
body[data-theme="neon"]{--bg:#0d0f1a;--panel:#171a2b;--text:#e8ecff;--muted:#8f97c4;--accent:#00e5a0;--accent-soft:#1c2a44;--border:#262c4a;--ok:#00e5a0;--warn:#ffd166;--bad:#ff5c8a;--bubble-c:#1d2138;--bubble-o:#00b380;--bubble-o-text:#04150e;--shadow:0 2px 12px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;white-space:nowrap}
.logo small{color:var(--muted);font-weight:400}
.hspace{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--text);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
.chip.ok{background:var(--ok);color:#fff}
.chip.bad{background:var(--bad);color:#fff}
.chip.dim{opacity:.65}
.chip.cat{font-weight:600}
.xpwrap{display:flex;flex-direction:column;gap:2px;min-width:150px}
.bar{height:8px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.bar.big{height:12px}
nav.tabs{display:flex;gap:6px;padding:0 0 10px;flex-wrap:wrap}
button{font-family:inherit;font-size:14px;cursor:pointer}
.tab{background:none;border:1px solid transparent;border-radius:8px;padding:7px 14px;color:var(--muted);font-weight:600}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:16px 0 60px}
.tabpane{display:none}
.tabpane.active{display:block}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmpcol{border:1px solid var(--border);border-radius:10px;padding:10px;min-width:0}
.cmpcol .ans{white-space:pre-wrap;font-size:13.5px;margin-bottom:6px;background:var(--accent-soft);border-radius:8px;padding:6px 9px}
.factrow{font-size:13.5px;padding:3px 0}
.factrow.miss{opacity:.6}
@media(max-width:860px){.catgrid{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.statcards{grid-template-columns:1fr}.msg{max-width:95%}.cmpgrid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px}
.card h4{margin:14px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
h2{font-size:19px;margin:4px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.catcard{position:relative;background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;color:var(--text);display:flex;flex-direction:column;gap:4px;transition:border-color .2s, transform .1s}
.catcard:hover{border-color:var(--accent)}
.catcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.catcard.locked{opacity:.55;filter:grayscale(.4)}
.catcard .cicon{font-size:26px}
.catcard .cname{font-weight:600;font-size:13.5px}
.catcard .ccount{font-size:11.5px;color:var(--muted)}
.lock{position:absolute;top:8px;right:8px;font-size:11px;background:var(--warn);color:#fff;border-radius:6px;padding:1px 6px}
.btn{background:var(--accent-soft);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.big{padding:11px 26px;font-size:15px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end;margin-top:10px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sessbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chat{background:var(--panel);border:1px solid var(--border);border-radius:12px;height:44vh;min-height:300px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:85%}
.msg.client{align-self:flex-start}
.msg.op{align-self:flex-end;flex-direction:row-reverse}
.ava{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.msg.op .ava{background:var(--ok)}
.bub{background:var(--bubble-c);border:1px solid var(--border);border-radius:12px;padding:8px 12px;white-space:pre-wrap;box-shadow:var(--shadow)}
.msg.client .bub{border-top-left-radius:3px}
.msg.op .bub{background:var(--bubble-o);color:var(--bubble-o-text);border-color:var(--bubble-o);border-top-right-radius:3px}
.typing{align-self:flex-start;color:var(--muted);font-size:12.5px;padding-left:40px;font-style:italic}
.inputrow{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.tplchips{display:flex;gap:6px;flex-wrap:wrap}
.tplchip{background:var(--accent-soft);border:1px dashed var(--accent);color:var(--text);border-radius:8px;padding:3px 10px;font-size:12px}
textarea#answer{width:100%;resize:vertical;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;background:var(--panel);color:var(--text)}
textarea#answer:focus{outline:2px solid var(--accent)}
.review h3{margin-top:0}
.kchip{border-radius:8px;padding:3px 10px;font-size:12.5px;border:1px solid var(--border)}
.kchip.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.kchip.miss{opacity:.55}
.refcard{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;white-space:pre-wrap}
.chklist{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.chk:hover{border-color:var(--accent)}
.chk input{margin-top:3px}
.xpbrd{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
.xpbrd .tot{font-size:17px;font-weight:700;color:var(--accent)}
.xpbrd table{width:100%;border-collapse:collapse}
.xpbrd td{padding:2px 0}
.xpbrd td:last-child{text-align:right;font-weight:600}
.result .totxp{font-size:26px;font-weight:800;color:var(--ok)}
.scorewrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.scorebig{font-size:36px;font-weight:800;color:var(--accent);line-height:1}
.scorebig span{font-size:16px;color:var(--muted);font-weight:600}
.scoretab{border-collapse:collapse;font-size:13.5px}
.scoretab td{padding:2px 12px 2px 0}
.scoretab td:last-child{font-weight:700;text-align:right}
.sgood{color:var(--ok)}
.smid{color:var(--warn)}
.sbad{color:var(--bad)}
.grammbox{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:8px 0}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;font-size:12.5px}
.badge .bic{font-size:26px}
.badge.locked{opacity:.4;filter:grayscale(1)}
.badge b{display:block;font-size:13px}
.quest{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.quest.done{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 8%, transparent)}
.quest .bar{margin:6px 0 3px}
.themechip{background:var(--accent-soft);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-weight:600}
.themechip.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.themechip:disabled{opacity:.45;cursor:not-allowed}
.tplitem{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.tplitem .tt{font-weight:700;font-size:13px}
.tplitem .tx{white-space:pre-wrap;font-size:13px}
input[type=text]{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:var(--panel);color:var(--text);width:100%}
.chart{width:100%;height:auto}
.chart .barrect{fill:var(--accent)}
.chart .bval{font-size:9px;fill:var(--muted)}
.chart .blab{font-size:9px;fill:var(--muted)}
.statcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.statcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.statcard .v{font-size:22px;font-weight:800;color:var(--accent)}
.statcard .l{font-size:12px;color:var(--muted)}
.weakitem{margin-bottom:8px}
.weakitem .bar{margin-top:3px}
.history details{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.history summary{cursor:pointer;font-size:13.5px}
.histbody{border-top:1px dashed var(--border);margin-top:8px;padding-top:8px;font-size:13.5px}
.histbody .lab{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;margin:8px 0 3px}
.grouplab{font-weight:700;margin:14px 0 6px;color:var(--accent)}
.phr{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:7px 12px;margin-bottom:6px;font-size:13.5px}
.phr button{white-space:nowrap}
.mist{counter-reset:none;border-left:4px solid var(--warn);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
.adminpanel,.kbpanel{margin-top:10px;background:var(--panel);border:1px dashed var(--accent);border-radius:12px;padding:12px}
.ordercard{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:8px}
.ordercard table{width:100%;border-collapse:collapse;margin-top:4px}
.ordercard td{border-top:1px solid var(--border);padding:4px 6px;font-size:13px;vertical-align:top}
.ordercard td:first-child{color:var(--muted);width:95px;white-space:nowrap}
.ordercard .ostat{font-weight:700;color:var(--warn)}
.ordermiss{color:var(--bad);font-weight:700;margin-top:8px}
.kbpanel input{margin-bottom:8px}
.kbitem{border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:6px;overflow:hidden}
.kbitem b{font-size:13.5px}
.kbitem .kbcat{float:right;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 6px}
.kbitem p{margin:3px 0 0}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--accent);border-left:5px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:13.5px;animation:slidein .3s}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes slidein{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:860px){.catgrid{grid-template-columns:repeat(2,1fr)}.grid2,.grid3,.statcards{grid-template-columns:1fr}.msg{max-width:95%}}
</style>
</head>
<body data-theme="light">
<header>
  <div class="wrap hdr">
    <div class="logo">🛠 ТехноДім <small>· Support Trainer</small></div>
    <div class="hspace"></div>
    <span class="chip" id="hLevel">—</span>
    <div class="xpwrap"><div class="bar"><div class="fill" id="hXpFill" style="width:0%"></div></div><span class="small muted" id="hXpText">0 XP</span></div>
    <span class="chip" id="hStreak">🔥 0 дн.</span>
  </div>
</header>
<div class="wrap">
  <nav class="tabs">
    <button class="tab active" data-tab="train">💬 Тренування</button>
    <button class="tab" data-tab="assess">🧪 Тест</button>
    <button class="tab" data-tab="shift">🕹 Зміна</button>
    <button class="tab" data-tab="profile">🎯 Профіль</button>
    <button class="tab" data-tab="stats">📊 Статистика</button>
    <button class="tab" data-tab="guide">📚 Довідник</button>
  </nav>
</div>
<main class="wrap">
  <section id="tab-train" class="tabpane active"></section>
  <section id="tab-assess" class="tabpane"></section>
  <section id="tab-shift" class="tabpane"></section>
  <section id="tab-profile" class="tabpane"></section>
  <section id="tab-stats" class="tabpane"></section>
  <section id="tab-guide" class="tabpane"></section>
</main>
<div id="toasts"></div>
<script src="scenarios.js"></script>
<script src="eng-mistakes.js"></script>
<script>
"use strict";
/* ===== Support Trainer «ТехноДім». Уся логіка локальна, без бібліотек. ===== */
var $ = function(sel){ return document.querySelector(sel); };
var $$ = function(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); };
function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysAgoKey(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtSec(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function hashStr(str){ var h=7; for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h)||1; }
function seededRand(seed){ var x=seed|0; return function(){ x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; }; }

/* --- База сценаріїв: сценарії приходять зі scenarios.js і частин scenarios_01..12.js,
       кожна частина робить window.SCENARIOS.push(...). Якщо якоїсь частини немає —
       застосунок працює з тим, що вже завантажено. --- */
if(!Array.isArray(window.SCENARIOS)) window.SCENARIOS = [];
if(typeof window.s !== "function"){ window.s = function(id,cat,dfn,ct,first,follows,ref,keys,checks){ return {id:id,cat:cat,dfn:dfn,ct:ct,first:first,follows:follows,ref:ref,keys:keys,checks:checks}; }; }
var CL = window.CHECKLIST || (window.CHECKLIST = {
  G:"Є привітання та ввічливе звернення",
  E:"Емпатія: визнано почуття й ситуацію клієнта",
  A:"Є вибачення за незручності",
  U:"Уточнено дані: № замовлення, ТТН, модель, дата",
  R:"Дано конкретне рішення або точну інформацію",
  N:"Означено наступний крок і терміни",
  F:"Ввічливе прощання з пропозицією допомоги",
  P:"Запропоновано альтернативу або вибір",
  O:"Відповідь узгоджується з правилами ТехноДім",
  D:"Відмову пояснено причиною, без сухого «ні»",
  C:"Тон спокійний, без сперечань і виправдань",
  B:"Ситуацію взято під особистий контроль",
  W:"Подяковано за звернення або за терпіння",
  K:"Надано реквізити, контакти чи посилання",
  V:"Дані клієнта перевірено перед рішенням",
  M:"Запропоновано додаткову цінність (бонус, сервіс)"
});

/* --- Категорії, типи клієнтів, теми --- */
var CATS = [
  {id:"доставка", icon:"🚚", short:"Доставка", unlock:1},
  {id:"оплата", icon:"💳", short:"Оплата", unlock:1},
  {id:"технічні питання", icon:"🔌", short:"Техніка", unlock:1},
  {id:"зміна замовлення", icon:"✏️", short:"Замовлення", unlock:2},
  {id:"повернення", icon:"🔄", short:"Повернення", unlock:3},
  {id:"знижки", icon:"🏷️", short:"Знижки", unlock:4},
  {id:"гарантія", icon:"🛡️", short:"Гарантія", unlock:5},
  {id:"брак", icon:"⚠️", short:"Брак", unlock:6},
  {id:"клієнт пише з помилками/суржиком", icon:"📝", short:"Суржик/помилки", unlock:7},
  {id:"скарги", icon:"😟", short:"Скарги", unlock:9},
  {id:"неввічливий клієнт", icon:"😠", short:"Неввічливі", unlock:12},
  {id:"англомовний клієнт", icon:"🌍", short:"Англ. клієнти", unlock:15}
];
var CT = { "спокійний":"😌", "розгублений":"🤔", "злий":"😤", "поспішає":"⏱️", "торгується":"💰" };
var THEMES = [
  {id:"light", name:"Світла", unlock:1},
  {id:"dark", name:"Темна", unlock:3},
  {id:"sea", name:"Морська", unlock:6},
  {id:"cream", name:"Кремова", unlock:9},
  {id:"forest", name:"Лісова", unlock:12},
  {id:"neon", name:"Неонова", unlock:16}
];
var GREETINGS = ["добрий день","доброго дня","добрий ранок","доброго ранку","добрий вечір","доброго вечора","вітаю","привіт","здрастуйте","здравствуйте","hello","good morning","good afternoon","good evening","hi ","hi!","hi,","dear","welcome"];
var EMPATHY = ["вибач","перепрош","розумію","співчув","шкода","жаль","незручно","поділяю","сочувств","sorry","apologi","i understand","unfortunately","i see","that must be","frustrat"];
var CAPS_OK = ["HDMI","ТТН","СМС","НП","СВЧ","ТЕН","УКР","ПОШТА","НОВА","ТЕХНОДІМ"];

/* --- Стан у localStorage (Етап 5: schemaVersion, покрокова міграція, захист від втрат) --- */
var LS = "technodimTrainer.v1";
var LS_CORRUPT = LS + ".corrupt";      /* сирий рядок, якщо JSON зламаний або міграція впала */
var SCHEMA = 2;
var CORRUPT_MODE = false;              /* true — працюємо з тимчасовим станом, LS не перезаписуємо */
function defaultState(){
  return {version:2, schemaVersion:2, xp:0, streak:0, bestStreak:0, dayStreak:0, lastDay:null,
    history:[], xpByDay:{}, doneByCat:{}, doneCount:0, totalSec:0,
    fastCount:0, quick30:0, empathyCount:0, keysHits:0, keysPossible:0,
    cleanCount:0, angryCount:0, engCount:0, catsTried:{}, questsDoneTotal:0,
    badges:[], theme:"light", templates:[], tplSeq:1, quests:null,
    demoUnlock:false, seenHint:false,
    escStats:{required:0, missed:0, unnecessary:0, correct:0}};

/* Побудова стану з об'єкта: тільки додає поля, нічого не видаляє.
   qa100 старим записам історії НЕ вигадуємо — вони лишаються без нього («до версії 2.0»). */
function migrateState(o){
  var v = (o && (o.schemaVersion || o.version)) || 1;
  var s = Object.assign(defaultState(), o);
  if (v < 2){
    s.schemaVersion = 2; s.version = 2;
    s.escStats = s.escStats || {required:0, missed:0, unnecessary:0, correct:0};
  }
  return s;
}
var LOAD_INFO = (function(){
  var raw = null;
  try { raw = localStorage.getItem(LS); } catch(e){}
  if (raw == null) return { state: defaultState(), fresh: true };
  var parsed = null, err = null;
  try { parsed = JSON.parse(raw); } catch(e){ err = String(e); }
  if (err || !parsed || typeof parsed !== "object"){
    try { localStorage.setItem(LS_CORRUPT, raw); } catch(e2){}
    return { state: defaultState(), corrupt: raw, corruptErr: err || "структура не об'єкт" };
  }
  var oldV = parsed.schemaVersion || parsed.version || 1;
  var needs = oldV < SCHEMA;
  var backupKey = LS + ".backup-v" + oldV;
  if (needs){
    var already = null;
    try { already = localStorage.getItem(backupKey); } catch(e2){}
    if (already == null){ try { localStorage.setItem(backupKey, raw); } catch(e3){} }   /* сирокопія — ніколи не перезаписується */
  }
  try {
    return { state: migrateState(parsed), migratedFrom: needs ? oldV : null, backupKey: needs ? backupKey : null };
  } catch(e){
    try { localStorage.setItem(LS_CORRUPT, raw); } catch(e2){}
    return { state: defaultState(), corrupt: raw, corruptErr: "помилка міграції: " + e };
  }
})();
var S = LOAD_INFO.state;
var CORRUPT_MODE = !!LOAD_INFO.corrupt;
function save(){ if (CORRUPT_MODE) return; try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
/* --- Рівні та прогресія --- */
var MAXL = 25;
function needFor(l){ return 60 + 15*l; }
function levelInfo(xp){
  var l = 1, rem = Math.max(0, xp|0);
  while(l < MAXL && rem >= needFor(l)){ rem -= needFor(l); l++; }
  return {level:l, into:rem, need:(l < MAXL ? needFor(l) : 0)};
}
function lvl(){ return levelInfo(S.xp).level; }
function rankOf(l){ return l<=5 ? "Стажер" : l<=10 ? "Молодший оператор" : l<=15 ? "Оператор" : l<=20 ? "Старший оператор" : "Тімлід"; }
function diffUnlock(){ var l = lvl(); return l>=12 ? 5 : l>=8 ? 4 : l>=4 ? 3 : 2; }
function catUnlocked(c){ return S.demoUnlock || lvl() >= c.unlock; }

var NEXTSTEP = ["напиш","повідомл","зв'яж","підскаж","підкаж","питанн","допомог","оформл","перевір","протягом","сьогодні","завтра","вечора","годин","хвилин","підтвердіт","скажіть","перевірте","гляньте","чекайте","очікуйт","готов","рекоменд","варіант","виріш","зроблю","зверніться","звертайтеся","i will","i'll","you will receive","you'll get","let me know","please send","within","we will"];
function checkBasics(answers){
  var text = answers.join(" ").trim();
  var low = text.toLowerCase();
  var greeting = GREETINGS.some(function(g){ return low.indexOf(g) !== -1; });
  var words = text.split(/[\s.,!?;:()\[\]{}"'«»\-–—]+/).filter(Boolean);
  var badCaps = words.filter(function(w){

  });
  var first = (answers[0]||"").trim();
  var firstLow = first.toLowerCase();
  var vy = low.indexOf("вам") !== -1 || low.indexOf("вас") !== -1 || low.indexOf("ваш") !== -1 ||

    low.indexOf("thank you") !== -1 || low.indexOf("kindly") !== -1 ||
    /(^|[\s,.;!?])ви([\s,.;!?]|$)/.test(low);
  var sentence = firstWords(first) >= 5 || /[.!?]/.test(first);

  var lastStep = lastLow.indexOf("?") !== -1 || NEXTSTEP.some(function(m){ return lastLow.indexOf(m) !== -1; });
  return {greeting:greeting, caps:badCaps.length === 0, badCaps:badCaps,
    len:text.length >= 40 && text.length <= 1500, chars:text.length,
    vy:vy, sentence:sentence, lastStep:lastStep,
    empathy:EMPATHY.some(function(e){ return low.indexOf(e) !== -1; })};

function firstWords(s){ return s.split(/[\s.,!?;:()"'«»\-–—]+/).filter(Boolean).length; }
/* --- Автопорівняння з еталоном: ключові факти та заборонене --- */
var FORBIDDEN = [
  {l:"Випитування конфіденційних даних (CVV, пароль, пін-код, код із SMS)", s:["cvv","пін-код","код з смс","код із смс","скажіть пароль","назвіть пароль","який пароль","надішліть пароль","пароль від акаунта","пароль від кабінету"]},
  {l:"Обіцянка точної години прибуття", s:["рівно о ","точно о ","рівно в ","гарантує годину","приїде рівно"]},
  {l:"Грубість або звинувачення клієнта", s:["самі винні","сам винен","не істеріть","не кричіть","майте совість","безладдя влаштовуєте"]},
  {l:"Обіцянка миттєвого повернення коштів поза правилами", s:["поверну за годину","повернення за годину","гроші за годину","поверну сьогодні ж"]},
  {l:"Переведення спілкування в особисті контакти", s:["мій особистий","мій номер телефону","поке","давайте поза чатом"]}
];
function factsFor(scen){ return (window.KEYFACTS && window.KEYFACTS[scen.id]) || []; }
/* --- Етап 1: прозора перевірка фактів без AI: нормалізація чисел, синоніми фраз,
       заперечення (вікно ±4 слова в межах клозу), збіг лише в клозі з 3+ словами. --- */
var NEGATORS = ["не","ні","немає","нема","без","ніхто","ніколи","нічого"];
var NUM_WORDS = [[" п'ять "," 5 "],[" чотири "," 4 "],[" три "," 3 "],[" двох "," 2 "],[" два "," 2 "],[" дві "," 2 "],[" один "," 1 "],[" одна "," 1 "]];
var PHRASE_SYNONYMS = [
  ["номер посилки","ттн"],["номер відправлення","ттн"],["трек номер","ттн"],["трек-номер","ттн"],
  ["стежитиму","проконтролюю"],["стежу за","проконтролюю"],["контролюватиму","проконтролюю"],
  ["шостої вечора","18:00"],["о шостій вечора","18:00"],["до шостої","до 18:00"],
  ["напишу вам","напишіть вам"],["напишемо вам","напишіть вам"],
  ["2 тижні","14 днів"],["2 тижнів","14 днів"],["2 тижня","14 днів"],["тиждень","7 днів"]
];
function normalizeAnswerText(low){
  var t = " " + String(low).replace(/[’`]/g,"'").replace(/[«»"()]/g," ").replace(/\s+/g," ").trim() + " ";
  for (var i = 0; i < NUM_WORDS.length; i++) t = t.split(NUM_WORDS[i][0]).join(NUM_WORDS[i][1]);
  t = t.replace(/[–—]/g,"-");
  for (var j = 0; j < PHRASE_SYNONYMS.length; j++) t = t.split(PHRASE_SYNONYMS[j][0]).join(PHRASE_SYNONYMS[j][1]);
  return t;
}
function stemEvidence(stem, norm){
  var s = String(stem).toLowerCase().replace(/[–—]/g,"-");
  if (s.indexOf("не ") === 0) { var lit = norm.indexOf(s) !== -1; return { literal:true, pos: lit?1:0, neg:0, none: !lit }; }
  var isGreeting = GREETINGS.some(function(g){ return s.indexOf(g) === 0; });
  var sentences = norm.split(/[.!?]+/);
  var pos = 0, neg = 0;
  for (var i = 0; i < sentences.length; i++){
    var sentence = sentences[i];
    var sentenceWords = sentence.split(/\s+/).filter(Boolean).length;
    var clauses = sentence.split(/[,;]+/);
    for (var k = 0; k < clauses.length; k++){
      var clause = clauses[k];
      var idx = clause.indexOf(s);
      while (idx !== -1){
        var before = clause.slice(0, idx).trim().split(/\s+/).filter(Boolean);
        var after = clause.slice(idx + s.length).trim().split(/\s+/).filter(Boolean);
        var negated = false;
        for (var d = 1; d <= 4 && !negated; d++){
          if (before.length >= d && NEGATORS.indexOf(before[before.length - d]) !== -1) negated = true;
          else if (after.length >= d && NEGATORS.indexOf(after[d - 1]) !== -1) negated = true;
        }
        /* доказ: речення ≥3 слів АБО клоз із числом 3+ цифр (номер замовлення/ТТН/сума) */
        if (negated) neg++;
        else if (isGreeting || sentenceWords >= 3 || /\d{3,}/.test(clause)) pos++;
        idx = clause.indexOf(s, idx + s.length);
      }
    }
  }
  return { literal:false, pos: pos, neg: neg, none: (pos + neg) === 0 };
}
function analyzeFacts(scen, answers, refNorm){
  var list = factsFor(scen);
  var norm = normalizeAnswerText(answers.join("\n").toLowerCase());
  var rnorm = refNorm != null ? refNorm : normalizeAnswerText(String(scen.ref || "").toLowerCase());
  var out = [], contradictions = 0, shortOnly = 0;
  list.forEach(function(f){
    var hit = false, opposite = 0, foundStems = 0, shortStems = 0;
    (f.s || []).forEach(function(st){
      var e = stemEvidence(st, norm);
      var r = stemEvidence(st, rnorm);
      /* полярність факту бере еталон: якщо в еталоні стем лише заперечений — у відповіді теж має бути заперечення */
      var expectNeg = !e.literal && r.neg > 0 && r.pos === 0;
      var stemHit = e.literal ? e.pos > 0 : (expectNeg ? e.neg > 0 : e.pos > 0);
      if (stemHit) hit = true;
      if (!e.literal && (e.pos + e.neg) > 0){
        foundStems++;
        if (!stemHit){
          if (expectNeg && e.pos > 0 && e.neg === 0) opposite++;
          else if (!expectNeg && e.neg > 0 && e.pos === 0) opposite++;
          else shortStems++;
        }
      }
    });
    if (!hit && foundStems > 0){
      if (opposite > 0) contradictions++;
      else if (shortStems > 0) shortOnly++;
    }
    out.push({l:f.l, hit:hit});
  });
  var hits = out.filter(function(f){ return f.hit; }).length;
  return {list:out, pct: out.length ? Math.round(hits/out.length*100) : 100,
          contradictions: contradictions, shortOnly: shortOnly};
}
function checkForbidden(answers){
  var low = answers.join("\n").toLowerCase();
  return FORBIDDEN.filter(function(f){ return f.s.some(function(st){ return low.indexOf(st) !== -1; }); });
}
/* Сміття — ЛИШЕ за формою: менше 2 реальних слів, жодної голосної,
   або більшість слів — набір літер (4+ приголосних підряд, фрагмент ряду клавіатури 4+,
   повтор складу, подвоєна приголосна). */
var KEYBOARD_ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm","йцукенгшщзхї","фівапролджє","ячсмитьбю"];
function isSaladWord(w){
  if(!/[аеєиіїоуюяaeiouy]/i.test(w)) return true;
  var lw = w.toLowerCase();
  if(/[бвгґджзйклмнпрстфхцчшщ]{4,}/.test(lw)) return true;
  if(/[bcdfghjklmnpqrstvwxz]{4,}/.test(lw)) return true;
  for(var r = 0; r < KEYBOARD_ROWS.length; r++){
    var row = KEYBOARD_ROWS[r];
    for(var p = 0; p + 4 <= row.length; p++){
      if(lw.indexOf(row.substr(p, 4)) !== -1) return true;
    }
  }
  if(/(.{2,3})\1/.test(lw)) return true;
  if(/([бвгґджзйклмнпрстфхцчшщ])\1\1/.test(lw)) return true;
  var dbl = lw.match(/([бвгґджзйклмнпрстфхцчшщ])\1/);
  if(dbl && lw.length >= 5){
    var vowels = (lw.match(/[аеєиіїоуюяaeiouy]/g) || []).length;
    if(vowels < 2) return true;
  }
  return false;
}
function isGarbage(answers){
  var text = (answers||[]).join(" ").trim();
  if(!text) return true;
  var words = text.split(/[^A-Za-zА-Яа-яЄєІіЇїҐґ’’]+/).filter(function(w){ return w.length >= 2; });
  if(words.length < 2) return true;
  if(!/[аеєиіїоуюяaeiouy]/i.test(text)) return true;
  var salad = words.filter(isSaladWord).length;
  return salad > words.length / 2;
}
function calcXP(scen, ctx){
  var factPct = (ctx.factPct == null) ? 100 : ctx.factPct;
  if(ctx.garbage){
    /* Сміття за формою — 0 XP, оцінка 1/10, серія скидається. */
    return {base:0, speed:0, dialog:0, basic:0, keys:0, cl:0, factPct:factPct, factXP:0,
      forb:0, orderAdj:0, noAns:0, sum:0, mult:1, total:0, counted:false, garbage:true, weak:false};
  }
  if(factPct < 20){
    /* Слабка відповідь: 1–5 XP за ввічливість і грамотність, без бонусів; серія НЕ скидається. */
    var weakXP = 1 + Math.round(((ctx.scorePolite||0) + (ctx.scoreLiteracy||0))/20*4);
    weakXP = Math.max(1, Math.min(5, weakXP));
    return {base:0, speed:0, dialog:0, basic:0, keys:0, cl:0, factPct:factPct, factXP:0,
      forb:0, orderAdj:0, noAns:0, sum:weakXP, mult:1, total:weakXP, counted:false, garbage:false, weak:true};
  }
  var capped = ctx.scoreCapped || false;   /* Етап 3 правка: спрацювала стеля оцінки — множники і бонуси вимкнено */
  var base = factPct >= 50 ? scen.dfn * 10 : 0;   /* 20–49%: без стандартних бонусів */
  var speed = (!capped && factPct >= 50) ? (ctx.sec <= 30 ? 25 : (ctx.sec <= 60 ? 15 : 0)) : 0;
  var dialog = (!capped && factPct >= 50 && ctx.nAnswers >= 1 + scen.follows.length) ? 10 : 0;
  var b = ctx.basic || {};
  var basicPassed = (b.greeting?1:0) + (b.caps?1:0) + (b.len?1:0) + (b.vy?1:0) + (b.lastStep?1:0);
  var basicXP = basicPassed * 4;
  var keys = (ctx.keysFound||0) * 2;
  var cl = (ctx.checked||0) * 5;
  var factXP = factPct >= 50 ? Math.round(factPct/2) : 0;
  var forb = -Math.min(2, ctx.forbidden||0) * 10;
  var orderAdj = capped ? Math.min(0, ctx.orderAdj || 0) : (ctx.orderAdj || 0);
  var noAns = ctx.noAnswer ? -15 : 0;
  var escBonus = (!capped) ? (ctx.escBonus || 0) : 0;   /* Етап 3: бонус лише за правильну ескалацію обов'язкового сценарію */
  var sum = base + speed + dialog + basicXP + keys + cl + factXP + forb + orderAdj + noAns + escBonus;
  var total = Math.round(sum * (capped ? 1 : (ctx.mult||1)));
  var counted = factPct >= 50;
  if(!counted) total = Math.max(0, Math.min(total, 5));
  if (ctx.missedEsc) total = Math.round(total * 0.5);   /* пропущена обов'язкова ескалація — ≤~50% XP */
  return {base:base, speed:speed, dialog:dialog, basic:basicXP, keys:keys, cl:cl,
    factPct:factPct, factXP:factXP, forb:forb, orderAdj:orderAdj, noAns:noAns, escBonus:escBonus,
    sum:sum, mult:ctx.mult||1, total:total, counted:counted, garbage:false, weak:false};
}

/* --- Щоденні квести --- */
function questLabel(q){
  switch(q.type){
    case "count": return "Пройди " + q.target + " сценаріїв будь-яких категорій";
    case "xp": return "Зароби " + q.target + " XP за день";
    case "cat": return "Пройди " + q.target + " сценарії категорії «" + q.param + "»";
    case "greet": return "Дай " + q.target + " відповіді з привітанням (автоперевірка)";
    case "empathy": return "Дай " + q.target + " відповіді з емпатією (автоперевірка)";
    case "fast": return q.target + " відповіді швидше ніж за 60 с";
    case "keys": return "Влуч у " + q.target + " ключових слів сумарно";
    case "clean": return "Дай " + q.target + " відповіді без порушень базових правил";
  }
  return q.type;
}
function genQuests(dateKey){
  var rnd = seededRand(hashStr("q" + dateKey));
  var types = ["count","xp","cat","greet","empathy","fast","keys","clean"];
  var pool = types.slice();
  for(var i = pool.length-1; i > 0; i--){ var j = Math.floor(rnd()*(i+1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  var okCats = CATS.filter(catUnlocked).map(function(c){ return c.id; });
  return pool.slice(0,3).map(function(t){
    if(t === "count") return {type:t, target:3+Math.floor(rnd()*4), reward:50};
    if(t === "xp") return {type:t, target:80+Math.floor(rnd()*4)*20, reward:60};
    if(t === "cat") return {type:t, target:2+Math.floor(rnd()*2), param:okCats[Math.floor(rnd()*okCats.length)] || "доставка", reward:55};
    if(t === "greet") return {type:t, target:3, reward:45};
    if(t === "empathy") return {type:t, target:3, reward:45};
    if(t === "fast") return {type:t, target:2, reward:50};
    if(t === "keys") return {type:t, target:8+Math.floor(rnd()*3)*2, reward:50};
    return {type:"clean", target:3, reward:55};
  }).map(function(q){ q.prog = 0; q.done = false; return q; });
}
function ensureQuests(){
  var t = todayKey();
  if(!S.quests || S.quests.date !== t){ S.quests = {date:t, list:genQuests(t)}; save(); }
}
function updateQuests(ev){
  if(!S.quests) return;
  S.quests.list.forEach(function(q){
    if(q.done) return;
    var hit = false;
    switch(q.type){
      case "count": hit = true; break;
      case "xp": q.prog += ev.total; break;
      case "cat": hit = (ev.cat === q.param); break;
      case "greet": hit = ev.checks.greeting; break;
      case "empathy": hit = ev.checks.empathy; break;
      case "fast": hit = (ev.sec <= 60); break;
      case "keys": q.prog += ev.keysFound; break;
      case "clean": hit = (ev.checks.greeting && ev.checks.caps && ev.checks.len); break;
    }
    if(hit) q.prog += 1;
    if(q.prog >= q.target){
      q.done = true;
      S.questsDoneTotal = (S.questsDoneTotal||0) + 1;
      S.xp += q.reward;
      S.xpByDay[todayKey()] = (S.xpByDay[todayKey()]||0) + q.reward;
      toast("🎯 Квест виконано: " + questLabel(q) + " (+" + q.reward + " XP)");
    }
  });
}

function sendAnswer(){

/* --- Поведінка клієнта: черга = заплановані репліки + фінальна «Дякую, зрозумів».
   Після фінальної клієнт мовчить. finishToReview() викликає лише closeTicket(). --- */
var FINAL_CLIENT_MSG = "Дякую, зрозумів";
var WAIT_CLIENT_MSG = "Добре, чекаю";
function logChat(who, text){ if(T) T.chatLog.push({who:who, text:text}); }
function clientQueue(){ return T.scen.follows.concat([FINAL_CLIENT_MSG]); }
function hasWaitingPhrase(text){
  var low = (text||"").toLowerCase();
  return ["хвилинку","хвилиночку","уточню","уточняю","перевірю","перевіряю","зачекайте","подивлюсь","подивлюся"]
    .some(function(w){ return low.indexOf(w) !== -1; });
}
/* Утримання = фраза очікування без конкретики (номерів замовлень, сум). */
function isHoldMsg(text){
  return hasWaitingPhrase(text) && !/\d{3,}/.test(text||"");
}
function isQuestionText(text){
  var low = (text||"").toLowerCase().trim();
  return low.indexOf("?") !== -1 || /^(чому|що|як|коли|де|скільки|чи|які|хто)(\s|,|!)/.test(low);
}
function clientSays(text){
  T.phase = "typing";
  var sb = $("#sendBtn"); if(sb) sb.disabled = true;
  var c = $("#chat");
  if(c) c.insertAdjacentHTML("beforeend", '<div class="typing" id="typing">Клієнт друкує…</div>');
  scrollChat();
  setTimeout(function(){
    var tp = $("#typing"); if(tp) tp.remove();
    if(T && T.phase === "typing"){
      pushClient(text);
      logChat("client", text);
      T.phase = "chat";
      var b = $("#sendBtn"); if(b) b.disabled = false;
      var a = $("#answer"); if(a) a.focus();
    }
  }, 1000);
}
function clientReact(){
  var q = clientQueue();
  if(isHoldMsg(T.answers[T.answers.length - 1])){
    /* Клієнт чекає і не видає наступну заплановану репліку — тільки після наступного повідомлення оператора */
    if(T.qi < q.length){ T.hold = true; clientSays(WAIT_CLIENT_MSG); }
    return;
  }
  if(T.qi < q.length){
    T.hold = false;
    clientSays(q[T.qi]);
    T.qi++;
  }
  /* Інакше клієнт уже сказав фінальну репліку і мовчить */
}
function closeTicket(){
  if(!T || (T.phase !== "chat" && T.phase !== "typing")) return;
  var log = T.chatLog || [];
  var last = log[log.length - 1];
  var q = clientQueue();
  /* Тікет закрито без відповіді: клієнт чекає (після «хвилинку»), останнє — питання клієнта
     або останнє повідомлення оператора обіцяє перевірку, яку він так і не дав */
  T.noAnswerClose = !!((T.hold && T.qi < q.length) ||
    (last && last.who === "op" && isHoldMsg(last.text)) ||
    (last && last.who === "client" && isQuestionText(last.text)));
  finishToReview();
}
function skipScenario(){
  stopTimer();
  if(S.streak > 0) toast("Серію правильних відповідей перервано");
  S.streak = 0;
  save();
  T = null;
  renderPicker();
}

/* --- Автооцінка: словник типових мовних помилок --- */
var GRAMMAR = [
  {bad:"на рахунок", good:"щодо"},

function repetitionMult(sid){
  var repeats = 0;
  for (var i = 0; i < S.history.length; i++) { if (S.history[i] && S.history[i].sid === sid) repeats++; }
  return repeats === 0 ? (1 + 0.05 * Math.min(S.streak, 10)) : 1;

function exportProgress(){
  /* Етап 5: у файлі — і тренування, і стан «Тесту» з його історією */
  var payload = { app:"technodim-trainer", exportedAt:new Date().toISOString(), schema:SCHEMA, trainer:S,
    assessment:(function(){ try { return JSON.parse(localStorage.getItem("technodimAssessment.v1") || "null"); } catch(e){ return null; } })(),
    assessmentHistory:(function(){ try { return JSON.parse(localStorage.getItem("technodimAssessment.history.v1") || "[]"); } catch(e){ return []; } })(),
    shift:(function(){ try { return JSON.parse(localStorage.getItem("technodimShift.v1") || "null"); } catch(e){ return null; } })(),
    shiftHistory:(function(){ try { return JSON.parse(localStorage.getItem("technodimShift.history.v1") || "[]"); } catch(e){ return []; } })() };
  var d = new Date();
  var name = "technodim-progress-" + d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + ".json";
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 500);
  toast("Експортовано: " + name);
}
function importProgress(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      var t = o && (o.trainer || o);            /* підтримка старих експортів (голий стан v1) */
      if (!t || typeof t !== "object" || typeof t.xp !== "number" || (t.history && !t.history.push)) throw new Error("не схоже на файл прогресу");
      if (!confirm("Замінити поточний прогрес імпортованим? Поточні дані буде перезаписано.")) return;
      CORRUPT_MODE = false;
      LOAD_INFO.corrupt = null;
      S = migrateState(t);
      save();
      try {
        if (o.assessment) localStorage.setItem("technodimAssessment.v1", JSON.stringify(o.assessment));
        else localStorage.removeItem("technodimAssessment.v1");
        if (o.assessmentHistory) localStorage.setItem("technodimAssessment.history.v1", JSON.stringify(o.assessmentHistory));
        if (o.shift) localStorage.setItem("technodimShift.v1", JSON.stringify(o.shift));
        if (o.shiftHistory) localStorage.setItem("technodimShift.history.v1", JSON.stringify(o.shiftHistory));
      } catch(e2){}
      try { localStorage.removeItem(LS_CORRUPT); } catch(e3){}
      applyTheme(); ensureQuests(); renderHeader(); renderProfile(); renderStats();
      var bs = document.querySelector("[data-sysbanner]"); if (bs) bs.remove();
      toast("Прогрес імпортовано ✓");
    }catch(e){ toast("❌ Некоректний файл прогресу: " + e.message); }
  };
  r.readAsText(file);
}

/* ===== Статистика ===== */
function buildChart(){
  var days = [];
  for(var i = 13; i >= 0; i--){ var k = daysAgoKey(i); days.push({k:k, v:S.xpByDay[k]||0}); }
  var max = Math.max(10, Math.max.apply(null, days.map(function(d){ return d.v; })));
  var w = 560, h = 150, col = w/14;
  var svg = '<svg viewBox="0 0 ' + w + ' ' + (h+20) + '" class="chart" role="img" aria-label="XP за 14 днів">';
  days.forEach(function(d, i){
    var bh = Math.round(d.v/max*h);
    var x = i*col + 5, bw = col - 10;
    svg += '<rect x="' + x + '" y="' + (h-bh) + '" width="' + bw + '" height="' + bh + '" rx="3" class="barrect"><title>' + d.k + ': ' + d.v + ' XP</title></rect>';
    if(d.v > 0) svg += '<text x="' + (x+bw/2) + '" y="' + (h-bh-4) + '" text-anchor="middle" class="bval">' + d.v + '</text>';
    svg += '<text x="' + (x+bw/2) + '" y="' + (h+14) + '" text-anchor="middle" class="blab">' + d.k.slice(8) + '</text>';
  });
  svg += '</svg>';
  return svg;
}
function weakPoints(){
  var agg = {};
  S.history.forEach(function(h){
    (h.checksAll||[]).forEach(function(k){ if(!agg[k]) agg[k] = {ok:0, tot:0}; agg[k].tot++; });
    (h.checked||[]).forEach(function(k){ if(agg[k]) agg[k].ok++; });
  });
  return Object.keys(agg).map(function(k){
    var v = agg[k];
    return {name:CL[k]||k, pct:v.tot ? Math.round(v.ok/v.tot*100) : 0, tot:v.tot};
  }).sort(function(a,b){ return a.pct - b.pct; }).slice(0,6);
}

      '<div class="statcard"><div class="v">' + shArch.length + '</div><div class="l">змін завершено</div></div></div>' +
      '<p class="muted small">Метрики отримані з навчальної симуляції, а не з реальної роботи.</p>'

  var wp = weakPoints();

      '<div class="bar"><div class="fill" style="width:' + w.pct + '%;background:' + (w.pct < 40 ? 'var(--bad)' : w.pct < 70 ? 'var(--warn)' : 'var(--ok)') + '"></div></div></div>';
  });

  S.history.slice(0,15).forEach(function(h){
    var d = new Date(h.ts);
    html += '<details><summary>' + (h.proper?'✅':'⬜') + ' ' + d.toLocaleDateString("uk-UA") + ' ' + d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}) +

      (h.qa100 != null ? ' · QA ' + h.qa100 + '/100' : ' · <span class="muted">до версії 2.0</span>') + '</summary><div class="histbody">' +
      '<div class="lab">Ви (' + h.answers.length + ' відповіді, ключові ' + h.keysFound + '/' + h.keysTotal + '):</div>' +
      h.answers.map(function(a){ return '<div style="white-space:pre-wrap">— ' + esc(a) + '</div>'; }).join("") +
      '<div class="lab">Еталон:</div><div class="refcard" style="font-size:13px">' + esc(h.ref) + '</div></div></details>';
  });
  html += '</div></div></div>';
  /* ===== Етап 5: розширена статистика ===== */
  (function(){
    var byCat = {};
    CATS.forEach(function(c){ byCat[c.id] = { count:0, qaSum:0, qaN:0, scoreSum:0, scoreN:0 }; });

      catRows.forEach(function(c){

    /* Динаміка QA за останні 14 днів (SVG без бібліотек) */
    var days = [];
    for (var di = 13; di >= 0; di--){
      var d0 = new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate() - di);

    html += '<div class="card" style="margin-top:14px"><h3>📈 Динаміка QA за останні 14 днів</h3>' +

    /* Топ-5 повторюваних помилок: пропущені факти, FORBIDDEN, ескалації, ENG_MISTAKES */

      var refNorm = normalizeAnswerText(String(sc.ref||"").toLowerCase());
      var fa = analyzeFacts(sc, h.answers || [], refNorm);

      }
    });
    var top = Object.keys(mistakeCount).map(function(k){ return { label:k, n:mistakeCount[k] }; })
      .sort(function(a,b){ return b.n - a.n; }).slice(0,5);
    html += '<div class="card" style="margin-top:14px"><h3>🔁 Топ-5 повторюваних помилок</h3>';
    if (!top.length) html += '<p class="muted small">Помилок поки не зафіксовано.</p>';
    top.forEach(function(m){ html += '<div class="factrow">' + esc(m.label) + ' <span class="chip">' + m.n + '×</span></div>'; });
    html += '</div>';
    /* Історія тестових завдань «Тест» — окремо від тренувань */
    var arch = (window.Assessment && window.Assessment.getArchive) ? window.Assessment.getArchive() : [];
    html += '<div class="card" style="margin-top:14px"><h3>🧪 Історія тестових завдань</h3>';
    if (!arch.length) html += '<p class="muted small">Ще не завершено жодного тестового завдання.</p>';
    arch.forEach(function(a){
      var d = new Date(a.ts);
      html += '<div class="factrow">' + d.toLocaleDateString("uk-UA") + ' ' + d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}) +
        ' · <b>' + esc(a.level) + '</b> · середній QA <b>' + (a.avg != null ? a.avg : "—") + '/100</b> · здано ' + (a.doneCount != null ? a.doneCount : "—") + '/10' +
        (a.reason === "time" ? ' · час вийшов' : a.reason === "early" ? ' · достроково' : '') + '</div>';
    });
    html += '</div>';
  })();
  $("#tab-stats").innerHTML = html;
  $$("#tab-stats [data-train-cat]").forEach(function(b){
    b.addEventListener("click", function(){
      pick.english = false;
      pick.cat = b.dataset.trainCat;
      pick.diff = 0;
      switchTab("train");
    });
  });
}

function copyText(txt, btn){
  function done(){ if(btn){ var o = btn.textContent; btn.textContent = "✓ Скопійовано"; setTimeout(function(){ btn.textContent = o; }, 1200); } }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
}

}

/* ===== Завантаження частин сценаріїв та запуск ===== */
var PARTS_TOTAL = 12;
window.PARTS_LOADED = 0;
window.PARTS_MISSING = [];
function loadPart(i){
  return new Promise(function(res){
    if(i > PARTS_TOTAL){ res(); return; }
    var sc = document.createElement("script");
    sc.src = "scenarios_" + String(i).padStart(2,"0") + ".js";
    sc.onload = function(){ window.PARTS_LOADED++; loadPart(i+1).then(res); };
    sc.onerror = function(){ window.PARTS_MISSING.push(i); loadPart(i+1).then(res); };
    document.head.appendChild(sc);
  });
}

    setTimeout(function(){ toast("👋 Ласкаво просимо! Оберіть категорію та пройдіть перший сценарій."); }, 600);
  }
}
